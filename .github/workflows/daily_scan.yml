name: GaryPOWER Daily Scan

on:
  # 每天北京时间 07:00 运行（UTC 23:00）
  # 美股收盘后第二天早上拿到完整日线数据
  # schedule:
  #  - cron: "30 5,6,7,20 * * Mon-Fri"   # 周一至周五
  
  # cloudflare worker 触发 时间 run_repo_b
  repository_dispatch:
    types: [run_repo_c] # 监听 B 事件
    
  # GitHub 页面手动触发
  workflow_dispatch:
    inputs:
      period:
        description: "数据周期 (e.g. 2y / 1y / 6mo)"
        required: false
        default: "2y"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60        # 标的多，给足时间

    env:
      RESEND_KEY:  ${{ secrets.RESEND_KEY }}
      SCAN_PERIOD: ${{ github.event.inputs.period || '2y' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GaryPOWER scan
        run: python src/garypower.py
